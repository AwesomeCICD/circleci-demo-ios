version: 2.1

# Starbucks in-store device update pipeline.
#
# Builds a NATIVE macOS utility, packages it as a signed + notarized .dmg, blocks
# the release if notarization was skipped, then tags the release back to GitHub
# and publishes the artifact. One Apple Silicon executor produces a universal
# (arm64 + x86_64) binary for the whole store fleet.

orbs:
  aws-cli: circleci/aws-cli@5.4.0

parameters:
  skip-notarization:
    type: boolean
    default: false
    description: >-
      DEMO TOGGLE. When true, the build bypasses Apple notarization — reproducing
      the change that shipped a broken (un-notarized) build to stores where
      devices rejected it. The release-gate job then BLOCKS publish.
  publish-external:
    type: boolean
    default: false
    description: >-
      When true, also upload the signed .dmg to external artifact storage
      (S3 / Azure Blob). Off by default so the demo runs anywhere.

executors:
  macos-m4:
    macos:
      xcode: "16.4.0"
    resource_class: m4pro.medium

jobs:
  build-and-test:
    executor: macos-m4
    steps:
      - checkout
      - run:
          name: Toolchain versions
          command: swift --version && xcodebuild -version
      - run:
          name: "Unit tests — USB image integrity (hash verification)"
          command: |
            mkdir -p test-results
            swift test --xunit-output "$PWD/test-results/store-updater.xml"
      - store_test_results:
          path: test-results
      - run:
          name: "Build universal binary (Apple Silicon + Intel, one executor)"
          command: bash scripts/build_universal.sh
      - run:
          name: "Assemble .app bundle"
          command: bash scripts/make_app.sh
      - run:
          name: "Package .dmg (the store update image)"
          command: bash scripts/make_dmg.sh
      - run:
          name: "Code sign"
          command: bash scripts/sign.sh
      - store_artifacts:
          path: dist
      - persist_to_workspace:
          root: .
          paths:
            - dist

  release-gate:
    executor: macos-m4
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: "Notarize the .dmg (or simulate a skip)"
          command: SKIP_NOTARIZATION="<< pipeline.parameters.skip-notarization >>" bash scripts/notarize_gate.sh
      - run:
          name: "RELEASE GATE — block publish unless notarized"
          command: bash scripts/verify_notarization.sh
      - persist_to_workspace:
          root: .
          paths:
            - dist

  publish:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: "Drop macOS filesystem metadata from the release folder"
          command: find dist -name '._*' -delete
      - run:
          name: "Tag the release back to GitHub"
          command: bash scripts/tag_release.sh
      - when:
          condition: << pipeline.parameters.publish-external >>
          steps:
            - aws-cli/setup:
                role_arn: ${AWS_ROLE_ARN}
                region: ${AWS_REGION}
            - run:
                name: "Upload .dmg to external artifact storage (S3 / Azure Blob)"
                command: bash scripts/publish.sh
      - run:
          name: "Publish summary"
          command: bash scripts/publish_summary.sh
      - store_artifacts:
          path: dist

  debug-retry-seed:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: Record original workflow ID
          command: |
            mkdir -p /tmp/retry-proof
            printf '%s\n' "$CIRCLE_WORKFLOW_ID" > /tmp/retry-proof/original-workflow-id
      - persist_to_workspace:
          root: /tmp/retry-proof
          paths:
            - original-workflow-id

  debug-retry-proof:
    executor: macos-m4
    steps:
      - attach_workspace:
          at: /tmp/retry-proof
      - run:
          name: Prove Electron debug output and workflow rerun
          environment:
            DEBUG: "electron-osx-sign*"
          command: |
            set -euo pipefail

            TEST_ROOT=$(mktemp -d)
            cd "$TEST_ROOT"
            npm init -y >/dev/null
            npm install --no-save @electron/osx-sign@1.3.3 >/dev/null

            APP="$TEST_ROOT/DebugProof.app"
            mkdir -p "$APP/Contents/MacOS"
            cat > "$APP/Contents/Info.plist" \<<'PLIST'
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
              <key>CFBundleExecutable</key>
              <string>DebugProof</string>
              <key>CFBundleIdentifier</key>
              <string>com.circleci.debug-proof</string>
              <key>CFBundleName</key>
              <string>DebugProof</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
            </dict>
            </plist>
            PLIST
            cat > "$TEST_ROOT/main.c" \<<'C'
            int main(void) {
              return 0;
            }
            C
            clang "$TEST_ROOT/main.c" -o "$APP/Contents/MacOS/DebugProof"
            export TEST_APP="$APP"

            node \<<'NODE' 2>&1 | tee signer.log
            const { signAsync } = require('@electron/osx-sign');

            signAsync({
              app: process.env.TEST_APP,
              identity: '-',
              identityValidation: false,
              platform: 'darwin',
              preAutoEntitlements: false,
              preEmbedProvisioningProfile: false,
            }).catch((error) => {
              console.error(error);
              process.exit(1);
            });
            NODE

            grep -q 'electron-osx-sign' signer.log
            codesign --verify --strict --verbose=2 "$APP"

            ORIGINAL_WORKFLOW_ID=$(cat /tmp/retry-proof/original-workflow-id)
            if [ "$CIRCLE_WORKFLOW_ID" = "$ORIGINAL_WORKFLOW_ID" ]; then
              echo "Initial workflow attempt verified. Failing once to test automatic rerun."
              exit 42
            fi

            echo "Automatic workflow rerun verified."

workflows:
  store-device-update:
    max_auto_reruns: 1
    jobs:
      - build-and-test:
          filters:
            branches:
              only: starbucks
      - release-gate:
          requires:
            - build-and-test
          filters:
            branches:
              only: starbucks
      - debug-retry-seed:
          filters:
            branches:
              only: test/electron-debug-auto-rerun-starbucks
      - debug-retry-proof:
          requires:
            - debug-retry-seed
          filters:
            branches:
              only: test/electron-debug-auto-rerun-starbucks
      - publish:
          requires:
            - release-gate
          filters:
            branches:
              only: starbucks
